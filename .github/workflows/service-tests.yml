name: Service tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/service-tests.yml"
      - "context-agent/**"
      - "policy-agent/**"
      - "validator-agent/**"
      - "infrastructure/docker-compose.yml"
      - "infrastructure/docker-compose.service-tests.yml"
      - "infrastructure/.env.smoke.example"
      - "scripts/bootstrap_agent_config.sh"
      - "scripts/docker_preflight.sh"
      - "scripts/run_service_tests_ci.sh"
      - "Makefile"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: service-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-tests:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - context-agent
          - policy-agent
          - validator-agent
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run ${{ matrix.service }} tests
        run: bash scripts/run_service_tests_ci.sh "${{ matrix.service }}"
      - name: Publish runtime metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-test-metrics-${{ matrix.service }}-${{ github.run_id }}
          path: migration/service-tests/${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 14
