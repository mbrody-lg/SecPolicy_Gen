name: Dependency maintenance inventory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 1 * *"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build informational dependency report
        run: python scripts/build_dependency_maintenance_report.py
      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-maintenance-${{ github.run_id }}
          path: migration/dependency-maintenance/
          retention-days: 30
