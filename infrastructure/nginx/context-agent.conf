server {
    listen 443 ssl;
    server_name context-agent.test;

    ssl_certificate /etc/nginx/tls/context-edge.crt;
    ssl_certificate_key /etc/nginx/tls/context-edge.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://context-agent:5000;
        proxy_set_header Host context-agent.test;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
