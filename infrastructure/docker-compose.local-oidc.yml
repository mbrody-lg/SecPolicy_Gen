services:
  identity:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: secpolicy_identity
    user: "${LOCAL_OIDC_CERT_UID:-1000}:0"
    profiles:
      - local-oidc
    command:
      - start-dev
      - --import-realm
      - --http-enabled=true
      - --http-port=8080
      - --https-port=8443
      - --https-certificate-file=/opt/keycloak/conf/tls/identity.crt
      - --https-certificate-key-file=/opt/keycloak/conf/tls/identity.key
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-fake-local-keycloak-admin-password}
      - KC_HOSTNAME=${LOCAL_OIDC_HOSTNAME:-http://identity.test:8080}
      - KC_HOSTNAME_STRICT=true
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./.local-certs/identity.crt:/opt/keycloak/conf/tls/identity.crt:ro
      - ./.local-certs/identity.key:/opt/keycloak/conf/tls/identity.key:ro
    networks:
      internal:
        aliases:
          - identity.test
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  context-agent:
    volumes:
      - ./.local-certs/ca.crt:/etc/secpolicygen/local-oidc-ca.crt:ro
    environment:
      - OIDC_CA_BUNDLE=/etc/secpolicygen/local-oidc-ca.crt
      - OIDC_ALLOW_INSECURE_HTTP=${OIDC_ALLOW_INSECURE_HTTP:-false}
      - SESSION_COOKIE_SECURE=true
    depends_on:
      identity:
        condition: service_healthy

  context-browser-tests:
    volumes:
      - ./.local-certs/ca.crt:/etc/secpolicygen/local-oidc-ca.crt:ro
    environment:
      - NODE_EXTRA_CA_CERTS=/etc/secpolicygen/local-oidc-ca.crt
    depends_on:
      context-edge:
        condition: service_started

  context-edge:
    image: nginx:1.30.4-alpine
    profiles:
      - local-oidc
    ports:
      - "127.0.0.1:5443:443"
    volumes:
      - ./nginx/context-agent.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.local-certs/context-edge.crt:/etc/nginx/tls/context-edge.crt:ro
      - ./.local-certs/context-edge.key:/etc/nginx/tls/context-edge.key:ro
    depends_on:
      context-agent:
        condition: service_healthy
    networks:
      internal:
        aliases:
          - context-agent.test
